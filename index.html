<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>세일즈콜 코칭 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f2;
    --accent:#2563eb; --good:#16a34a; --warn:#dc2626; --accent2:#0d9488;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-bottom:6px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:13px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;display:none}
  .grid{display:grid;gap:16px;margin-top:18px}
  .kpis{grid-template-columns:repeat(5,1fr)}
  .row2{grid-template-columns:1.3fr 1fr}
  .row3{grid-template-columns:1fr 1fr}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.row2,.row3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;box-shadow:var(--shadow)}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:.2px;text-transform:none}
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:28px;font-weight:700;line-height:1}
  .kpi .val.small{font-size:18px}
  .kpi .foot{font-size:12px;color:var(--muted);margin-top:6px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .chartbox{position:relative;height:280px}
  .chartbox.short{height:150px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  td.num{font-variant-numeric:tabular-nums;font-weight:600}
  ul.clean{margin:0;padding-left:18px} ul.clean li{margin:5px 0;font-size:13.5px;line-height:1.5}
  .tag{font-size:11px;color:var(--muted)}
  .coachnum{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12px;align-items:center;justify-content:center;margin-right:8px;font-weight:700}
  footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
  .lock{font-size:12px;color:var(--muted)}
  .breakdown-row{display:flex;align-items:center;gap:10px;margin:10px 0}
  .breakdown-row .blabel{width:110px;font-size:12.5px;color:var(--muted);flex-shrink:0}
  .breakdown-row .btrack{flex:1;height:8px;border-radius:99px;background:#eef1f7;overflow:hidden}
  .breakdown-row .bfill{height:100%;border-radius:99px}
  .breakdown-row .bval{width:60px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .na{color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>세일즈콜 코칭 대시보드</h1>
      <p class="sub">SCORE-7 프레임워크 · 일 단위 강점/약점 추이</p>
    </div>
    <div>
      <label class="lock" for="repSel">상담원 </label>
      <select id="repSel" onchange="render()"></select>
    </div>
  </header>

  <div id="sampleBanner" class="banner"></div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid row2">
    <div class="card">
      <h2>일자별 평균 점수 추이 (5점 만점)</h2>
      <div class="chartbox"><canvas id="trend"></canvas></div>
    </div>
    <div class="card">
      <h2>최근일 7축 프로필</h2>
      <div class="chartbox"><canvas id="radar"></canvas></div>
    </div>
  </div>

  <div class="grid row3">
    <div class="card">
      <h2>최근일 콜유형 분포</h2>
      <div class="chartbox short"><canvas id="types"></canvas></div>
    </div>
    <div class="card">
      <h2>최근일 클로징 하위 신호</h2>
      <div id="closingBreakdown"></div>
    </div>
  </div>

  <div class="grid row3">
    <div class="card">
      <h2>일자별 발화비중 추이 (상담원 %)</h2>
      <div class="chartbox short"><canvas id="talkTrend"></canvas></div>
    </div>
    <div class="card">
      <h2>최근일 코칭 · 강점/개선점</h2>
      <div id="coach"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>근거 대사 (최근일 · 개인정보 마스킹)</h2>
      <div id="evidence"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>일자별 상세</h2>
      <div style="overflow-x:auto"><table id="daysTable"></table></div>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
// 배포 시엔 data/analytics.json 을 읽고, 단독 미리보기(파일 직접 열기)일 땐 아래 내장 샘플로 대체된다.
const SAMPLE = {
  "meta":{"framework":"SCORE-7 v1","axes":["오프닝&라포","니즈파악","가치제안","이의처리","클로징","커뮤니케이션","컴플라이언스"],"updated":"2026-07-29","is_sample":true,"privacy":"분석 결과만 포함합니다 — 통화 원문, 인용문, 전화번호 등 개인정보는 담기지 않습니다."},
  "reps":{"ishopuser002":{"display_name":"이샵유저002 (동규)","days":[
    {"date":"2026-07-28","n_calls":5,"call_types":{"아웃바운드":4,"인바운드":1},"avg_overall":3.1,"grade":"보통","axis_avg":{"오프닝&라포":3.4,"니즈파악":3.0,"가치제안":3.2,"이의처리":2.8,"클로징":2.2,"커뮤니케이션":3.6,"컴플라이언스":3.6},"avg_talk_ratio":{"rep":66,"customer":34},"closing_breakdown":{"next_step_clarity":2.4,"objection_recovery":null,"retention_attempt":2.0},"top_strengths":["오프닝에서 통화 목적을 간결히 안내","고객 발화를 끊지 않고 경청"],"top_weaknesses":["클로징에서 다음 단계를 고객에게 미룸","가치 설명이 기능 나열에 치우침"],"coaching":["모든 콜을 구체적 다음 약속(날짜·시간)으로 닫기","기능이 아니라 고객이 말한 문제에 연결해 설명하기","설명 후 고객 반응을 한 번씩 확인하기"],"compliance_flags":0},
    {"date":"2026-07-29","n_calls":7,"call_types":{"아웃바운드":6,"인바운드":1},"avg_overall":3.4,"grade":"보통","axis_avg":{"오프닝&라포":3.6,"니즈파악":3.4,"가치제안":3.4,"이의처리":3.1,"클로징":2.4,"커뮤니케이션":3.7,"컴플라이언스":3.5},"avg_talk_ratio":{"rep":61,"customer":39},"closing_breakdown":{"next_step_clarity":2.6,"objection_recovery":3.0,"retention_attempt":2.2},"top_strengths":["개방형 질문으로 고객 상황을 잘 끌어냄","오프닝 목적 안내가 안정적"],"top_weaknesses":["여러 콜에서 클로징 다음 단계 미확정","일부 콜에서 정보 정확성 주의 필요"],"coaching":["구체적 다음 약속으로 클로징 고정하기","확정 못 하는 조건은 '확인 후 회신'으로 처리","문제·시사 질문까지 한 단계 더 파고들기"],"compliance_flags":1,"evidence":[{"kind":"강점","point":"개방형 질문으로 상황 파악","quote":"지금은 어떤 방식으로 관리하고 계세요?"},{"kind":"개선점","point":"클로징에서 다음 단계를 고객에게 미룸","quote":"검토해보시고 편하실 때 연락 주세요"},{"kind":"개선점","point":"확정 불가한 조건을 단정","quote":"그건 언제든 100% 가능하세요"}]}
  ]}}
};

let DATA=null, charts={};
const scoreColor=v=> v>=4?getCSS('--good'): v>=3?getCSS('--accent'): getCSS('--warn');
function getCSS(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function gradePill(g){const c=g==='탁월'||g==='우수'?'--good':g==='보통'?'--accent':'--warn';
  return `<span class="pill" style="background:${hexA(getCSS(c),.12)};color:${getCSS(c)}">${g}</span>`}
function hexA(hex,a){const m=hex.replace('#','');const r=parseInt(m.substr(0,2),16),g=parseInt(m.substr(2,2),16),b=parseInt(m.substr(4,2),16);return `rgba(${r},${g},${b},${a})`}

async function load(){
  try{
    const res=await fetch('data/analytics.json',{cache:'no-store'});
    if(!res.ok) throw 0;
    DATA=await res.json();
  }catch(e){ DATA=SAMPLE; }
  const sel=document.getElementById('repSel');
  sel.innerHTML='';
  Object.keys(DATA.reps).forEach(id=>{
    const o=document.createElement('option'); o.value=id; o.textContent=DATA.reps[id].display_name||id; sel.appendChild(o);
  });
  // 샘플 배너
  const b=document.getElementById('sampleBanner');
  if(DATA.meta && DATA.meta.is_sample){ b.style.display='block';
    b.textContent='※ 지금은 샘플 데이터입니다. 실제 분석 결과를 data/analytics.json 으로 커밋하면 이 화면이 실데이터로 바뀝니다.'; }
  render();
}

function render(){
  const id=document.getElementById('repSel').value;
  const rep=DATA.reps[id];
  const days=[...rep.days].sort((a,b)=>a.date<b.date?-1:1);
  const last=days[days.length-1];
  const axes=DATA.meta.axes;

  // KPIs
  const totalCalls=days.reduce((s,d)=>s+(d.n_calls||0),0);
  const prev=days.length>1?days[days.length-2]:null;
  const delta=prev?(last.avg_overall-prev.avg_overall):null;
  const deltaTxt=delta===null?'':(delta>=0?`▲ +${delta.toFixed(1)}`:`▼ ${delta.toFixed(1)}`);
  const deltaCol=delta===null?'--muted':(delta>=0?'--good':'--warn');

  const tr=last.avg_talk_ratio;
  const trRep=tr?tr.rep:null;
  const trVal = trRep!==null ? `${trRep}<span style="font-size:15px;color:var(--muted)"> : ${tr.customer}</span>` : '—';
  const trWarn = trRep!==null && trRep>65;
  const trFoot = trRep===null ? '데이터 없음' : (trWarn ? '상담원 발화 과다' : trRep>=60 ? '다소 높음' : '양호');

  const kpis=[
    {label:`최근일(${last.date}) 평균`, val:last.avg_overall.toFixed(1), foot:prev?`전일 대비 <b style="color:${getCSS(deltaCol)}">${deltaTxt}</b>`:'기준일', small:false},
    {label:'최근일 등급', val:gradePill(last.grade), foot:`${last.n_calls}건 분석`, small:false},
    {label:'상담원:고객 발화비중', val:trVal, foot:trFoot, small:true, warn:trWarn},
    {label:'누적 분석 콜', val:totalCalls, foot:`${days.length}일`, small:false},
    {label:'최근일 컴플라이언스 플래그', val:last.compliance_flags||0, foot:(last.compliance_flags?'주의 필요':'이상 없음'), small:false}
  ];
  document.getElementById('kpis').innerHTML=kpis.map(k=>`
    <div class="card kpi"><div class="label">${k.label}</div><div class="val${k.small?' small':''}" style="${k.warn?`color:${getCSS('--warn')}`:''}">${k.val}</div><div class="foot" style="${k.warn?`color:${getCSS('--warn')};font-weight:600`:''}">${k.foot}</div></div>`).join('');

  // Trend line
  drawChart('trend','line',{
    labels:days.map(d=>d.date),
    datasets:[{label:'평균 점수',data:days.map(d=>d.avg_overall),
      borderColor:getCSS('--accent'),backgroundColor:hexA(getCSS('--accent'),.12),fill:true,tension:.3,
      pointRadius:4,pointBackgroundColor:getCSS('--accent')}]
  },{scales:{y:{min:1,max:5,ticks:{stepSize:1}}},plugins:{legend:{display:false}}});

  // Radar 7-axis
  drawChart('radar','radar',{
    labels:axes,
    datasets:[{label:last.date,data:axes.map(a=>last.axis_avg[a]??0),
      borderColor:getCSS('--accent'),backgroundColor:hexA(getCSS('--accent'),.15),
      pointBackgroundColor:getCSS('--accent')}]
  },{scales:{r:{min:0,max:5,ticks:{stepSize:1,display:false}}},plugins:{legend:{display:false}}});

  // Call type doughnut
  const ct=last.call_types||{};
  drawChart('types','doughnut',{
    labels:Object.keys(ct),
    datasets:[{data:Object.values(ct),backgroundColor:[getCSS('--accent'),getCSS('--accent2'),'#a855f7','#f59e0b']}]
  },{plugins:{legend:{position:'bottom'}}});

  // 발화비중 추이 (막대)
  const talkVals=days.map(d=> d.avg_talk_ratio ? d.avg_talk_ratio.rep : null);
  drawChart('talkTrend','bar',{
    labels:days.map(d=>d.date),
    datasets:[{label:'상담원 발화 %',data:talkVals,
      backgroundColor:talkVals.map(v=> v===null? '#e5e9f2' : v>65? hexA(getCSS('--warn'),.65) : hexA(getCSS('--accent'),.55))}]
  },{scales:{y:{min:0,max:100,ticks:{stepSize:20}}},plugins:{legend:{display:false}}});

  // 클로징 하위 신호 (최근일)
  const cb=last.closing_breakdown||{};
  const cbLabels={next_step_clarity:'다음 단계 합의',objection_recovery:'반론 극복',retention_attempt:'이탈 신호 대응'};
  document.getElementById('closingBreakdown').innerHTML = Object.entries(cbLabels).map(([k,label])=>{
    const v=cb[k];
    if(v===null || v===undefined){
      return `<div class="breakdown-row"><div class="blabel">${label}</div><div class="btrack"></div><div class="bval na">N/A</div></div>`;
    }
    const pct=(v/5*100).toFixed(0);
    const col=scoreColor(v);
    return `<div class="breakdown-row"><div class="blabel">${label}</div>
      <div class="btrack"><div class="bfill" style="width:${pct}%;background:${col}"></div></div>
      <div class="bval" style="color:${col}">${v.toFixed(1)}</div></div>`;
  }).join('') + `<p class="tag" style="margin-top:10px">해당 신호(막판 반론·이탈 신호)가 그날 콜에 없었으면 N/A로 표시됩니다.</p>`;

  // Coaching panel
  document.getElementById('coach').innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">코칭 (${last.date})</div>
    <ol style="margin:0 0 12px;padding-left:0;list-style:none">
      ${(last.coaching||[]).map((c,i)=>`<li style="margin:6px 0;font-size:13.5px;line-height:1.5"><span class="coachnum">${i+1}</span>${esc(c)}</li>`).join('')}
    </ol>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px"><div class="tag" style="color:var(--good);font-weight:600">강점</div>
        <ul class="clean">${(last.top_strengths||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
      <div style="flex:1;min-width:180px"><div class="tag" style="color:var(--warn);font-weight:600">개선점</div>
        <ul class="clean">${(last.top_weaknesses||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
    </div>`;

  // Evidence quotes (masked)
  const ev=last.evidence||[];
  document.getElementById('evidence').innerHTML = ev.length? ev.map(e=>{
    const col=e.kind==='강점'?'--good':'--warn';
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <span class="pill" style="background:${hexA(getCSS(col),.12)};color:${getCSS(col)};margin-right:8px">${esc(e.kind)}</span>
      <span style="font-size:13px;color:var(--muted)">${esc(e.point||'')}</span>
      <div style="margin-top:4px;font-style:italic;font-size:13.5px">“${esc(e.quote)}”</div></div>`;
  }).join('') : '<div style="color:var(--muted);font-size:13px">근거 대사 데이터가 없습니다.</div>';

  // Days table
  const rows=[...days].reverse().map(d=>{
    const t=d.avg_talk_ratio;
    const tCell = t ? `<span style="${t.rep>65?`color:${getCSS('--warn')};font-weight:700`:''}">${t.rep}%</span>` : '—';
    return `
    <tr><td>${d.date}</td><td class="num">${d.n_calls}</td>
    <td class="num" style="color:${scoreColor(d.avg_overall)}">${d.avg_overall.toFixed(1)}</td>
    <td>${gradePill(d.grade)}</td>
    <td class="num">${tCell}</td>
    <td>${Object.entries(d.call_types||{}).map(([k,v])=>`${k} ${v}`).join(' · ')}</td>
    <td>${d.compliance_flags?`<span style="color:var(--warn)">${d.compliance_flags}건</span>`:'—'}</td>
    <td style="color:var(--muted)">${esc((d.top_weaknesses||[])[0]||'')}</td></tr>`;
  }).join('');
  document.getElementById('daysTable').innerHTML=`
    <thead><tr><th>날짜</th><th>콜수</th><th>평균</th><th>등급</th><th>발화비중(상담원)</th><th>콜유형</th><th>플래그</th><th>대표 개선점</th></tr></thead>
    <tbody>${rows}</tbody>`;

  document.getElementById('footer').innerHTML=`
    <div><b>프레임워크</b> ${DATA.meta.framework} · <b>업데이트</b> ${DATA.meta.updated}</div>
    <div style="margin-top:6px">🔒 ${esc(DATA.meta.privacy||'')}</div>`;
}

function drawChart(id,type,data,opts){
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(document.getElementById(id),{type,data,
    options:Object.assign({responsive:true,maintainAspectRatio:false},opts)});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
load();
</script>
</body>
</html>
